[project]
name = "circuit-bench"
version = "0.2.0"
description = "Controlled multi-task circuit identifiability benchmark with planted, gate-verified circuits"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["benchmarks", "data", "discovery", "model", "train", "tests"]
stubPath = "typings"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
